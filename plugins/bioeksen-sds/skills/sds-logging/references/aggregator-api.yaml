openapi: 3.1.0

info:
  title: BioEksen Log Aggregator
  version: 1.0.0
  description: >-
    Normative definition of the log aggregator's own endpoints. Paths are
    relative to the aggregator host, denoted HOST in aggregator-api.md, which
    is the rationale layer for this file.

    The aggregator also exposes the four standard endpoints, unversioned, as
    every app does; those are defined in
    sds-api-design/references/openapi.yaml and are not repeated here.

    Shared schemas are referenced from that file rather than copied. A second
    copy of the error codes or of the log record fields could drift from the
    first, which is the failure this repository exists to prevent.

    Like every endpoint in the estate, these may also answer 405 (RES-4500),
    and a POST or PUT 413 (VAL-4550) or 415 (VAL-4600), per
    sds-api-design/references/standard-api-endpoints.md. Those are not
    repeated in each operation's responses.

paths:
  /api/v1/logs:
    post:
      summary: Submit a log record
      description: >-
        Validates an incoming record and stores it. Requires an app credential:
        any app able to reach this endpoint could otherwise forge records
        attributed to another id.
      operationId: submitLog
      tags: [logs]
      security:
        - appAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestDeadline"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogSubmission"
      responses:
        "201":
          description: Stored.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Location:
              description: >-
                The stored record, /api/v1/logs/{recordId}, per the create
                rule in sds-api-design/references/app-endpoints.md.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SubmitForbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/NotReady"

    get:
      summary: Fetch filtered, paginated logs across every app
      description: >-
        Same parameters, defaults and pagination as an app's own
        GET /api/admin/logs, except that id selects between apps rather than
        being implied. Requires an operator credential: this endpoint holds
        every app's logs, which makes it the highest-value read target in the
        estate.
      operationId: listLogs
      tags: [logs]
      security:
        - operatorAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestDeadline"
        - name: startDate
          in: query
          required: false
          description: >-
            Inclusive lower bound on timestamp. Defaults to 90 days before
            now, and is never clamped: how long the aggregator keeps a record
            depends on its type and severity, so an earlier startDate returns
            whatever is still kept.
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: false
          description: Inclusive upper bound on timestamp. Defaults to now.
          schema:
            type: string
            format: date-time
        - name: severity
          in: query
          required: false
          description: Defaults to all severities.
          schema:
            $ref: "#/components/schemas/Severity"
        - name: type
          in: query
          required: false
          description: Defaults to all types.
          schema:
            $ref: "#/components/schemas/LogType"
        - name: id
          in: query
          required: false
          description: >-
            The emitting service, app or process. Defaults to every app.
          schema:
            $ref: "#/components/schemas/SoftwareId"
        - name: code
          in: query
          required: false
          description: Exact error code. Defaults to all codes.
          schema:
            $ref: "#/components/schemas/ErrorCode"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: >-
            Matching records, newest first. A page beyond the last one returns
            an empty logs array with the true totalCount.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredLogPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/NotReady"

  # A concrete path, so it is matched before /api/v1/logs/{recordId}; the
  # aggregator never assigns "batch" as a recordId.
  /api/v1/logs/batch:
    post:
      summary: Submit up to 500 log records at once
      description: >-
        All or nothing: every record is stored, or none is. Each record is
        validated as a single submission is, and each record's id must be the
        submitting app's. A body over 1 MiB is refused with 413 VAL-4550
        before it is parsed.
      operationId: submitLogBatch
      tags: [logs]
      security:
        - appAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestDeadline"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogBatch"
      responses:
        "201":
          description: >-
            Every record stored. A batch creates several records, so no single
            Location names them; the body does.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SubmitForbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/v1/logs/{recordId}:
    get:
      summary: Fetch one stored record
      description: >-
        The path parameter is the aggregator-assigned recordId, not the
        record's id field, which names the emitting app.
      operationId: getLog
      tags: [logs]
      security:
        - operatorAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestDeadline"
        - name: recordId
          in: path
          required: true
          description: The identifier assigned on write.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Found.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/v1/logs/{recordId}/issue:
    put:
      summary: Record the issue that names a record, and the fix that resolves it
      description: >-
        Called by the git service's integration: open when an issue naming
        the record opens, resolved with the fixing commit's Change-Id when a
        pull request bringing a commit whose Fixes-Log trailer names the
        record is merged, and closed when the issue closes without a fix. A
        resolved record stays resolved. How long the record is then kept is
        the Retention table in aggregator-api.md.
      operationId: linkIssue
      tags: [logs]
      security:
        - resolverAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestDeadline"
        - name: recordId
          in: path
          required: true
          description: The identifier assigned on write.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueLink"
      responses:
        "200":
          description: The record, carrying its link.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ResolveForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/NotReady"

components:
  securitySchemes:
    appAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        App credential: an app-only JWT from the issuer named in
        sds-auth/references/credentials.md, whose roles hold logs.write. No
        delegated token satisfies it, an operator's included.
    operatorAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Operator credential: a delegated JWT from the same issuer, whose scp
        holds the configured operator scope and whose roles hold operator. An
        app credential never satisfies it.
    resolverAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        App credential whose roles hold logs.resolve: the git service's
        integration, which opens and closes the issues records are linked to.
        No delegated token satisfies it, an operator's included.

  headers:
    NoStore:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/headers/NoStore"
    RequestId:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/headers/RequestId"
    RetryAfter:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/headers/RetryAfter"

  # The cross-cutting request headers, referenced so that every app in the
  # estate takes the same ones under the same rules.
  parameters:
    RequestId:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/parameters/RequestId"
    RequestDeadline:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/parameters/RequestDeadline"
    IdempotencyKey:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/parameters/IdempotencyKey"

  responses:
    BadRequest:
      description: >-
        The record or a query parameter failed validation. For a submission,
        details lists the offending fields — by position for a batch, as
        records[3].severity — and the body MUST NOT be resubmitted unchanged.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid credential.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated, but not the principal this endpoint requires.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SubmitForbidden:
      description: >-
        PERM-4150 when the caller is not an app, lacks logs.write, or its azp
        resolves to no known app; PERM-4152 when the record's id is not the
        submitting app's.
        An operator credential never satisfies this endpoint.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ResolveForbidden:
      description: >-
        PERM-4150 when the caller is not an app holding logs.resolve. An
        operator credential never satisfies this endpoint: a record's link
        follows its issue, which is changed in the git service.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No record with that recordId, or one already deleted.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Caller is over its allowance.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >-
        RES-4301. The Idempotency-Key is already spent on a different body, or
        the original request is still in flight when the deadline runs out.
        Not retryable: a changed resubmission needs a fresh key.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: >-
        Stored nowhere because the database rejected the write, or the query
        failed. Not retryable: 500 is outside the range
        sds-api-design/references/service-calls.md retries.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotReady:
      description: >-
        The aggregator is not ready to accept or serve records, or its
        database is unreachable. Retryable.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # Referenced, never copied. A second definition of any of these could drift
    # from the first, and only the first is checked against code-prefixes.md.
    Severity:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/schemas/Severity"
    LogType:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/schemas/LogType"
    ErrorCode:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/schemas/ErrorCode"
    SoftwareId:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/schemas/SoftwareId"
    Error:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/schemas/Error"

    # A record as submitted: the six emitted fields and nothing else.
    # recordId is assigned on write, so a submission carrying one is rejected
    # rather than silently ignored — an app that thinks it chooses record
    # identifiers should find out immediately.
    # A DEBUG record never leaves the app that wrote it (log-record.md), so a
    # submitted one fails here and is refused with VAL-4006.
    LogSubmission:
      allOf:
        - $ref: "../../sds-api-design/references/openapi.yaml#/components/schemas/LogRecord"
        - not:
            required: [severity]
            properties:
              severity:
                const: DEBUG

    RecordId:
      type: string
      minLength: 1
      description: >-
        Assigned by the aggregator on write. Not part of a submitted record,
        and not the record's id field, which names the emitting app.

    # The six fields plus what the aggregator adds: the assigned identifier,
    # and the link to the issue that names the record, null when none does.
    # Composed from LogFields rather than restating it, with
    # unevaluatedProperties because additionalProperties cannot see through
    # allOf.
    StoredRecord:
      allOf:
        - $ref: "../../sds-api-design/references/openapi.yaml#/components/schemas/LogFields"
        - type: object
          required: [recordId, issue]
          properties:
            recordId:
              $ref: "#/components/schemas/RecordId"
            issue:
              anyOf:
                - $ref: "#/components/schemas/StoredIssue"
                - type: "null"
      unevaluatedProperties: false

    # The Change-Id format of sds-commit/references/release-notes.md, as
    # sds-commit's mint_change_id.py mints it: invariant 13 keeps this pattern
    # equal to that script's, so the two cannot drift.
    ChangeId:
      type: string
      pattern: '^([a-z0-9]+(?:-[a-z0-9]+)*)-(\d{8}T\d{6}Z?)-([a-z0-9]{4,})$'

    # What the git service sends, shared by the request and the stored link.
    # resolvedBy is the Change-Id of the commit whose Fixes-Log trailer named
    # the record, and is carried exactly when a fix resolved it.
    IssueLinkFields:
      type: object
      required: [ref, state]
      properties:
        ref:
          type: string
          minLength: 1
          maxLength: 512
          description: >-
            The issue as the git service names it, its URL or its key; for a
            fix no issue tracked, the pull request.
        state:
          type: string
          enum: [open, resolved, closed]
        resolvedBy:
          $ref: "#/components/schemas/ChangeId"
      if:
        properties:
          state:
            const: resolved
      then:
        required: [resolvedBy]
      else:
        not:
          required: [resolvedBy]

    IssueLink:
      allOf:
        - $ref: "#/components/schemas/IssueLinkFields"
      unevaluatedProperties: false

    # The link as stored: what the git service sent, and when its state last
    # changed, from which the 30 days after an issue run.
    StoredIssue:
      allOf:
        - $ref: "#/components/schemas/IssueLinkFields"
        - type: object
          required: [changedAt]
          properties:
            changedAt:
              type: string
              format: date-time
      unevaluatedProperties: false

    SubmitResult:
      type: object
      unevaluatedProperties: false
      required: [status, recordId]
      properties:
        status:
          type: string
          const: ok
        recordId:
          $ref: "#/components/schemas/RecordId"

    # Up to 500 records, each exactly a single submission. More than 500 is
    # VAL-4006, a value outside its range; the 1 MiB body limit is VAL-4550,
    # applied before the body is parsed.
    LogBatch:
      type: object
      additionalProperties: false
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/LogSubmission"

    BatchResult:
      type: object
      additionalProperties: false
      required: [status, recordIds]
      properties:
        status:
          type: string
          const: ok
        recordIds:
          type: array
          minItems: 1
          maxItems: 500
          description: The identifier assigned to each record, in submission order.
          items:
            $ref: "#/components/schemas/RecordId"

    # The same page wrapper an app's own logs endpoint returns, carrying stored
    # records instead of emitted ones.
    StoredLogPage:
      allOf:
        - $ref: "../../sds-api-design/references/openapi.yaml#/components/schemas/LogPageBase"
        - type: object
          required: [logs]
          properties:
            logs:
              type: array
              description: >-
                Newest first, tie-broken by recordId ascending so paging is
                stable. Empty, never null.
              items:
                $ref: "#/components/schemas/StoredRecord"
      unevaluatedProperties: false
