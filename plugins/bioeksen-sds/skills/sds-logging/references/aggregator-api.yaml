openapi: 3.1.0

info:
  title: BioEksen Log Aggregator
  version: 1.0.0
  description: >-
    Normative definition of the log aggregator's own endpoints. Paths are
    relative to the aggregator host, denoted HOST in aggregator-api.md, which
    is the rationale layer for this file.

    The aggregator also exposes the five standard endpoints, unversioned, as
    every app does; those are defined in
    sds-api-design/references/openapi.yaml and are not repeated here.

    Shared schemas are referenced from that file rather than copied. A second
    copy of the error codes or of the log record fields could drift from the
    first, which is the failure this repository exists to prevent.

    Like every endpoint in the estate, these may also answer 405 (RES-4500),
    and a POST or PUT 413 (VAL-4550) or 415 (VAL-4600), per
    sds-api-design/references/standard-api-endpoints.md. Those are not
    repeated in each operation's responses.

paths:
  /api/v1/logs:
    post:
      summary: Submit a log record
      description: >-
        Validates an incoming record and stores it. Requires an app credential:
        any app able to reach this endpoint could otherwise forge records
        attributed to another id.
      operationId: submitLog
      tags: [logs]
      security:
        - appAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestDeadline"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogSubmission"
      responses:
        "201":
          description: Stored.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Location:
              description: >-
                The stored record, /api/v1/logs/{recordId}, per the create
                rule in sds-api-design/references/app-endpoints.md.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SubmitForbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/NotReady"

    get:
      summary: Fetch filtered, paginated logs across every app
      description: >-
        Same parameters, defaults and pagination as an app's own
        GET /api/admin/logs, except that id selects between apps rather than
        being implied. Requires an operator credential: this endpoint holds
        every app's logs, which makes it the highest-value read target in the
        estate.
      operationId: listLogs
      tags: [logs]
      security:
        - operatorAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestDeadline"
        - name: startDate
          in: query
          required: false
          description: >-
            Inclusive lower bound on timestamp. Defaults to 90 days before
            now, and is never clamped: how long the aggregator keeps a record
            depends on its type and severity, so an earlier startDate returns
            whatever is still kept.
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: false
          description: Inclusive upper bound on timestamp. Defaults to now.
          schema:
            type: string
            format: date-time
        - name: severity
          in: query
          required: false
          description: Defaults to all severities.
          schema:
            $ref: "#/components/schemas/Severity"
        - name: type
          in: query
          required: false
          description: Defaults to all types.
          schema:
            $ref: "#/components/schemas/LogType"
        - name: id
          in: query
          required: false
          description: >-
            The emitting service, app or process. Defaults to every app.
          schema:
            $ref: "#/components/schemas/SoftwareId"
        - name: code
          in: query
          required: false
          description: Exact error code. Defaults to all codes.
          schema:
            $ref: "#/components/schemas/ErrorCode"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: >-
            Matching records, newest first. A page beyond the last one returns
            an empty logs array with the true totalCount.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredLogPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/NotReady"

  # A concrete path, so it is matched before /api/v1/logs/{recordId}; the
  # aggregator never assigns "batch" as a recordId.
  /api/v1/logs/batch:
    post:
      summary: Submit up to 500 log records at once
      description: >-
        All or nothing: every record is stored, or none is. Each record is
        validated as a single submission is, and each record's id must be the
        submitting app's. A body over 1 MiB is refused with 413 VAL-4550
        before it is parsed.
      operationId: submitLogBatch
      tags: [logs]
      security:
        - appAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestDeadline"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogBatch"
      responses:
        "201":
          description: >-
            Every record stored. A batch creates several records, so no single
            Location names them; the body does.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SubmitForbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/v1/logs/{recordId}:
    get:
      summary: Fetch one stored record
      description: >-
        The path parameter is the aggregator-assigned recordId, not the
        record's id field, which names the emitting app. The git service's
        integration also calls it, as an app holding logs.resolve, to find the
        group of a record a Fixes-Log trailer names.
      operationId: getLog
      tags: [logs]
      security:
        - operatorAuth: []
        - resolverAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestDeadline"
        - name: recordId
          in: path
          required: true
          description: The identifier assigned on write.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Found.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/v1/codes:
    get:
      summary: List the error codes this aggregator accepts
      description: >-
        The registry the aggregator was built from. Release verification reads
        it, and refuses a release whose build carries a code missing here,
        since the aggregator would refuse that code's records and they would
        never reach the archive. Open to an app holding logs.write, which is
        what submits records, and to an operator.
      operationId: listCodes
      tags: [codes]
      security:
        - appAuth: []
        - operatorAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestDeadline"
      responses:
        "200":
          description: Every code accepted, each once, in ascending order.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/v1/groups/{groupId}/issue:
    put:
      summary: Move an error group along its lifecycle, with the issue that tracks it
      description: >-
        Called by the git service's integration: linked when an issue naming
        the group opens or reopens, fix_merged with the fixing commit's
        Change-Id when a pull request bringing a commit whose Fixes-Log
        trailer names a record of the group is merged, resolved when a release
        carrying that Change-Id is deployed, and closed, with one closure
        label, when the issue closes without a fix. A group a fix has reached
        is not closed by its issue closing. Every record of the group carries
        the link. How long they are kept is the Retention section of
        aggregator-api.md.
      operationId: linkGroup
      tags: [groups]
      security:
        - resolverAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestDeadline"
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupLink"
      responses:
        "200":
          description: The group, in the state it is now in.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ResolveForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/v1/groups/{groupId}/occurrences:
    get:
      summary: Count a group's records past its cap
      description: >-
        A group keeps its first 100 and its latest 100 records whole. Every
        record that leaves the latest 100 is deleted and counted here instead:
        in hourly entries for 7 days, then merged into daily entries kept as
        long as the group.
      operationId: getGroupOccurrences
      tags: [groups]
      security:
        - operatorAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestDeadline"
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: The group's count entries, oldest first.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrences"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/NotReady"

components:
  securitySchemes:
    appAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        App credential: an app-only JWT from the issuer named in
        sds-auth/references/credentials.md, whose roles hold logs.write. No
        delegated token satisfies it, an operator's included.
    operatorAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Operator credential: a delegated JWT from the same issuer, whose scp
        holds the configured operator scope and whose roles hold operator. An
        app credential never satisfies it.
    resolverAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        App credential whose roles hold logs.resolve: the git service's
        integration, which opens and closes the issues error groups are
        linked to. No delegated token satisfies it, an operator's included.

  headers:
    NoStore:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/headers/NoStore"
    RequestId:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/headers/RequestId"
    RetryAfter:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/headers/RetryAfter"

  # The cross-cutting request headers, referenced so that every app in the
  # estate takes the same ones under the same rules.
  parameters:
    RequestId:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/parameters/RequestId"
    RequestDeadline:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/parameters/RequestDeadline"
    IdempotencyKey:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/parameters/IdempotencyKey"
    GroupId:
      name: groupId
      in: path
      required: true
      description: The identifier the aggregator assigned to the group.
      schema:
        $ref: "#/components/schemas/GroupId"

  responses:
    BadRequest:
      description: >-
        The record or a query parameter failed validation. For a submission,
        details lists the offending fields — by position for a batch, as
        records[3].severity — and the body MUST NOT be resubmitted unchanged.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid credential.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated, but not the principal this endpoint requires.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SubmitForbidden:
      description: >-
        PERM-4150 when the caller is not an app, lacks logs.write, or its azp
        resolves to no known app; PERM-4152 when the record's id is not the
        submitting app's.
        An operator credential never satisfies this endpoint.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ResolveForbidden:
      description: >-
        PERM-4150 when the caller is not an app holding logs.resolve. An
        operator credential never satisfies this endpoint: a group's link
        follows its issue, which is changed in the git service.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >-
        RES-4200. No record or group with that identifier. A record is
        deleted when its window ends, or when it leaves its group's latest 100
        records and is counted instead.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Caller is over its allowance.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >-
        RES-4301. The Idempotency-Key is already spent on a different body, or
        the original request is still in flight when the deadline runs out.
        Not retryable: a changed resubmission needs a fresh key.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StateConflict:
      description: >-
        RES-4302. The group's state does not allow the one requested:
        resolved is entered only from fix_merged, by the same Change-Id.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: >-
        Stored nowhere because the database rejected the write, or the query
        failed. Not retryable: 500 is outside the range
        sds-api-design/references/service-calls.md retries.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotReady:
      description: >-
        The aggregator is not ready to accept or serve records, or its
        database is unreachable. Retryable.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # Referenced, never copied. A second definition of any of these could drift
    # from the first, and only the first is checked against code-prefixes.md.
    Severity:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/schemas/Severity"
    LogType:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/schemas/LogType"
    ErrorCode:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/schemas/ErrorCode"
    SoftwareId:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/schemas/SoftwareId"
    Error:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/schemas/Error"

    # A record as submitted: the six emitted fields and nothing else.
    # recordId is assigned on write, so a submission carrying one is rejected
    # rather than silently ignored — an app that thinks it chooses record
    # identifiers should find out immediately.
    # A DEBUG record never leaves the app that wrote it (log-record.md), so a
    # submitted one fails here and is refused with VAL-4006.
    LogSubmission:
      allOf:
        - $ref: "../../sds-api-design/references/openapi.yaml#/components/schemas/LogRecord"
        - not:
            required: [severity]
            properties:
              severity:
                const: DEBUG

    RecordId:
      type: string
      minLength: 1
      description: >-
        Assigned by the aggregator on write. Not part of a submitted record,
        and not the record's id field, which names the emitting app.

    # The six fields plus what the aggregator adds: the assigned identifier,
    # the error group the record belongs to, and an AUDIT record's place in
    # its day's chain. Composed from LogFields rather than restating it, with
    # unevaluatedProperties because additionalProperties cannot see through
    # allOf.
    StoredRecord:
      allOf:
        - $ref: "../../sds-api-design/references/openapi.yaml#/components/schemas/LogFields"
        - type: object
          required: [recordId, group, chain]
          properties:
            recordId:
              $ref: "#/components/schemas/RecordId"
            group:
              anyOf:
                - $ref: "#/components/schemas/GroupId"
                - type: "null"
            chain:
              anyOf:
                - $ref: "#/components/schemas/ChainLink"
                - type: "null"
        # An AUDIT record is chained, and no other record is.
        - if:
            required: [type]
            properties:
              type:
                const: AUDIT
          then:
            properties:
              chain:
                $ref: "#/components/schemas/ChainLink"
          else:
            properties:
              chain:
                type: "null"
        # Every ERROR and FATAL record is in a group, except an AUDIT one,
        # which is never grouped, capped or counted. Every other record is in
        # none.
        - if:
            required: [severity, type]
            properties:
              severity:
                enum: [ERROR, FATAL]
              type:
                not:
                  const: AUDIT
          then:
            properties:
              group:
                $ref: "#/components/schemas/GroupId"
          else:
            properties:
              group:
                type: "null"
      unevaluatedProperties: false

    # An AUDIT record's place in the chain of the day it arrived on, per
    # aggregator-api.md: the hash it follows, and its own, which the next
    # record follows. The aggregator computes both; an app sends neither.
    ChainLink:
      type: object
      additionalProperties: false
      required: [day, prev, hash]
      properties:
        day:
          type: string
          format: date
          description: The UTC+03:00 calendar day the record arrived on.
        prev:
          $ref: "#/components/schemas/ChainHash"
        hash:
          $ref: "#/components/schemas/ChainHash"

    ChainHash:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: A SHA-256 digest, in lowercase hex.

    # A ULID, assigned when the group's first record arrives, so groupIds sort
    # by the time each failure was first seen.
    GroupId:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'

    # The Change-Id format of sds-commit/references/release-notes.md, as
    # sds-commit's mint_change_id.py mints it: invariant 13 keeps this pattern
    # equal to that script's, so the two cannot drift.
    ChangeId:
      type: string
      pattern: '^([a-z0-9]+(?:-[a-z0-9]+)*)-(\d{8}T\d{6}Z?)-([a-z0-9]{4,})$'

    GroupState:
      type: string
      enum: [open, linked, fix_merged, resolved, closed]
      description: >-
        open when the group's first record arrives; linked when an issue
        names it; fix_merged when a fix for it merges; resolved when a release
        carrying that fix is deployed; closed when its issue closes without a
        fix.

    ClosureLabel:
      type: string
      enum: [close:external, close:wont-fix, close:obsolete, close:not-reproducible]
      description: >-
        Why an issue closed without a fix. Exactly one is required to close
        one, and it decides whether a new record reopens the group.

    IssueRef:
      type: string
      minLength: 1
      maxLength: 512
      description: >-
        The issue as the git service names it, its URL or its key; for a fix
        no issue tracked, the pull request.

    # What the git service sends. The aggregator alone enters open, when a
    # group's first record arrives. changeId is the fix's from fix_merged on,
    # and label is carried exactly when the group closes.
    GroupLink:
      type: object
      additionalProperties: false
      required: [state, issue]
      properties:
        state:
          type: string
          enum: [linked, fix_merged, resolved, closed]
        issue:
          $ref: "#/components/schemas/IssueRef"
        changeId:
          $ref: "#/components/schemas/ChangeId"
        label:
          $ref: "#/components/schemas/ClosureLabel"
      allOf:
        - if:
            properties:
              state:
                enum: [fix_merged, resolved]
          then:
            required: [changeId]
          else:
            not:
              required: [changeId]
        - if:
            properties:
              state:
                const: closed
          then:
            required: [label]
          else:
            not:
              required: [label]

    # A group as the aggregator keeps it: its key, its state and link, when
    # the state last changed, from which the 30 days after resolving or
    # closing run, and the first and last time a record of it arrived.
    # Every link field is present and null when it does not apply, so a
    # client never has to tell "none" from "not reported".
    Group:
      type: object
      additionalProperties: false
      required: [groupId, id, code, op, signature, state, issue, changeId, label,
                 changedAt, firstSeen, lastSeen]
      properties:
        groupId:
          $ref: "#/components/schemas/GroupId"
        id:
          $ref: "#/components/schemas/SoftwareId"
        code:
          $ref: "#/components/schemas/ErrorCode"
        op:
          type: [string, "null"]
          minLength: 1
          description: The records' op= value, or null when they carry none.
        signature:
          type: string
          pattern: '^([0-9a-f]{16}|overflow)$'
          description: >-
            Computed by the aggregator from the records' error= and cause=
            values, per aggregator-api.md; overflow for the group that takes
            every signature past the twentieth of one id, code and op.
        state:
          $ref: "#/components/schemas/GroupState"
        issue:
          anyOf:
            - $ref: "#/components/schemas/IssueRef"
            - type: "null"
        changeId:
          anyOf:
            - $ref: "#/components/schemas/ChangeId"
            - type: "null"
        label:
          anyOf:
            - $ref: "#/components/schemas/ClosureLabel"
            - type: "null"
        changedAt:
          type: string
          format: date-time
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
      allOf:
        - if:
            properties:
              state:
                const: open
          then:
            properties:
              issue:
                type: "null"
          else:
            properties:
              issue:
                $ref: "#/components/schemas/IssueRef"
        - if:
            properties:
              state:
                enum: [fix_merged, resolved]
          then:
            properties:
              changeId:
                $ref: "#/components/schemas/ChangeId"
          else:
            properties:
              changeId:
                type: "null"
        - if:
            properties:
              state:
                const: closed
          then:
            properties:
              label:
                $ref: "#/components/schemas/ClosureLabel"
          else:
            properties:
              label:
                type: "null"

    # The codes are checked against the code format, never against the
    # ErrorCode enum: the list exists to compare two registries, so a reader
    # built from an older release must still read one holding a newer code.
    CodeList:
      type: object
      additionalProperties: false
      required: [status, codes]
      properties:
        status:
          type: string
          const: ok
        codes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Z][A-Z0-9]{1,7}-[45][0-9]{3}$'

    # One count entry: the records of a group deleted past its cap in one
    # hour or one day, starting at start. Days begin at midnight UTC+03:00.
    CountEntry:
      type: object
      additionalProperties: false
      required: [start, count, firstSeen, lastSeen]
      properties:
        start:
          type: string
          format: date-time
        count:
          type: integer
          minimum: 1
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time

    Occurrences:
      type: object
      additionalProperties: false
      required: [status, groupId, hourly, daily]
      properties:
        status:
          type: string
          const: ok
        groupId:
          $ref: "#/components/schemas/GroupId"
        hourly:
          type: array
          description: The last 7 days, oldest first. Empty, never null.
          items:
            $ref: "#/components/schemas/CountEntry"
        daily:
          type: array
          description: >-
            Every earlier day, merged from its hourly entries, oldest first.
            Empty, never null.
          items:
            $ref: "#/components/schemas/CountEntry"

    SubmitResult:
      type: object
      unevaluatedProperties: false
      required: [status, recordId]
      properties:
        status:
          type: string
          const: ok
        recordId:
          $ref: "#/components/schemas/RecordId"

    # Up to 500 records, each exactly a single submission. More than 500 is
    # VAL-4006, a value outside its range; the 1 MiB body limit is VAL-4550,
    # applied before the body is parsed.
    LogBatch:
      type: object
      additionalProperties: false
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/LogSubmission"

    BatchResult:
      type: object
      additionalProperties: false
      required: [status, recordIds]
      properties:
        status:
          type: string
          const: ok
        recordIds:
          type: array
          minItems: 1
          maxItems: 500
          description: The identifier assigned to each record, in submission order.
          items:
            $ref: "#/components/schemas/RecordId"

    # The same page wrapper an app's own logs endpoint returns, carrying stored
    # records instead of emitted ones.
    StoredLogPage:
      allOf:
        - $ref: "../../sds-api-design/references/openapi.yaml#/components/schemas/LogPageBase"
        - type: object
          required: [logs]
          properties:
            logs:
              type: array
              description: >-
                Newest first, tie-broken by recordId ascending so paging is
                stable. Empty, never null.
              items:
                $ref: "#/components/schemas/StoredRecord"
      unevaluatedProperties: false
