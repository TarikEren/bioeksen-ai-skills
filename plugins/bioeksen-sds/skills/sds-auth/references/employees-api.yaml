openapi: 3.1.0

info:
  title: BioEksen Employee Directory
  version: 1.0.0
  description: >-
    Normative definition of the employee directory's endpoints, which
    bio-softop serves and every app reads instead of keeping employees of its
    own. Paths are relative to the directory's host, denoted HOST in
    employees-api.md, which is the rationale layer for this file.

    Shared schemas are referenced from sds-api-design/references/openapi.yaml
    rather than copied. Like every endpoint in the estate, these may also
    answer 405 (RES-4500), per
    sds-api-design/references/standard-api-endpoints.md.

paths:
  /api/v1/employees:
    get:
      summary: List the employees
      description: >-
        Pages as every list does, per sds-api-design/references/app-endpoints.md,
        ordered by userId. Filtered by a company role, or by state.
      operationId: listEmployees
      tags: [employees]
      security:
        - directoryAuth: []
        - operatorAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestDeadline"
        - name: role
          in: query
          required: false
          description: Only the employees holding this company role. Defaults to all.
          schema:
            $ref: "#/components/schemas/CompanyRole"
        - name: state
          in: query
          required: false
          description: Only the employees in this state. Defaults to all.
          schema:
            $ref: "#/components/schemas/EmployeeState"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: >-
            The matching employees, ordered by userId. A page beyond the last
            returns an empty employees array with the true totalCount.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/v1/employees/{userId}:
    get:
      summary: Fetch one employee
      description: >-
        An erased employee is still found, by the userId the records that name
        them carry, with every personal field null.
      operationId: getEmployee
      tags: [employees]
      security:
        - directoryAuth: []
        - operatorAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestDeadline"
        - name: userId
          in: path
          required: true
          description: The employee's principal key, as their token carries it.
          schema:
            $ref: "#/components/schemas/UserId"
      responses:
        "200":
          description: Found.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/NotReady"

components:
  securitySchemes:
    directoryAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        App credential: an app-only JWT from the issuer named in
        credentials.md, whose roles hold employees.read. No delegated token
        satisfies it.
    operatorAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Operator credential: a delegated JWT from the same issuer, whose scp
        holds the configured operator scope and whose roles hold operator. An
        app credential never satisfies it.

  headers:
    NoStore:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/headers/NoStore"
    RequestId:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/headers/RequestId"
    RetryAfter:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/headers/RetryAfter"

  parameters:
    RequestId:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/parameters/RequestId"
    RequestDeadline:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/parameters/RequestDeadline"

  responses:
    BadRequest:
      description: A query parameter failed validation.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid credential.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        PERM-4150. Authenticated, but neither an app holding employees.read
        nor an operator.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: RES-4200. No employee has that userId.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Caller is over its allowance.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: The query failed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotReady:
      description: The directory is not ready to serve. Retryable.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      $ref: "../../sds-api-design/references/openapi.yaml#/components/schemas/Error"

    # The principal key the identity provider issues, per credentials.md: Entra's
    # oid, or Keycloak's sub. Both are lowercase UUIDs, the form user= takes.
    UserId:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'

    # A company role's name. Which names exist is the closed list in
    # credentials.md; the format is checked here, the membership by the
    # directory, as a query parameter outside an enumeration is.
    CompanyRole:
      type: string
      maxLength: 63
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'

    EmployeeState:
      type: string
      enum: [active, disabled, erased]
      description: >-
        active when the account can sign in; disabled when the identity
        provider has blocked or removed it; erased when the person's data was
        erased, and only the userId remains.

    # One employee. An erased employee keeps the userId, which the records
    # naming them carry, and nothing else: every personal field is null, and
    # they hold no role.
    Employee:
      type: object
      required: [userId, displayName, email, department, state, roles]
      properties:
        userId:
          $ref: "#/components/schemas/UserId"
        displayName:
          type: [string, "null"]
          minLength: 1
        email:
          type: [string, "null"]
          format: email
        department:
          type: [string, "null"]
          minLength: 1
        state:
          $ref: "#/components/schemas/EmployeeState"
        roles:
          type: array
          uniqueItems: true
          description: The company roles the employee holds now.
          items:
            $ref: "#/components/schemas/CompanyRole"
      if:
        properties:
          state:
            const: erased
      then:
        properties:
          displayName:
            type: "null"
          email:
            type: "null"
          department:
            type: "null"
          roles:
            maxItems: 0
      else:
        properties:
          displayName:
            type: string
          email:
            type: string

    EmployeeItem:
      allOf:
        - $ref: "#/components/schemas/Employee"
      unevaluatedProperties: false

    # A single employee, with the success status beside its fields, per
    # sds-api-design/references/app-endpoints.md.
    EmployeeResponse:
      allOf:
        - $ref: "#/components/schemas/Employee"
        - type: object
          required: [status]
          properties:
            status:
              type: string
              const: ok
      unevaluatedProperties: false

    EmployeePage:
      type: object
      additionalProperties: false
      required: [status, page, count, totalCount, employees, filterParams]
      properties:
        status:
          type: string
          const: ok
        page:
          type: integer
          minimum: 1
        count:
          type: integer
          minimum: 0
        totalCount:
          type: integer
          minimum: 0
        employees:
          type: array
          description: Ordered by userId. Empty, never null.
          items:
            $ref: "#/components/schemas/EmployeeItem"
        filterParams:
          type: object
          additionalProperties: false
          required: [role, state, page, limit]
          properties:
            role:
              oneOf:
                - $ref: "#/components/schemas/CompanyRole"
                - type: "null"
            state:
              oneOf:
                - $ref: "#/components/schemas/EmployeeState"
                - type: "null"
            page:
              type: integer
              minimum: 1
            limit:
              type: integer
              minimum: 1
              maximum: 200
