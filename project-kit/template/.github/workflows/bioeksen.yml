name: bioeksen

# The checks bioeksen-sds asks of every service. BIOEKSEN_SDS_REPO and
# BIOEKSEN_SDS_REF must match the source in .claude/settings.json, so the
# skills an assistant reads and the checks CI runs come from one release.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

env:
  BIOEKSEN_SDS_REPO: TarikEren/bioeksen-ai-skills
  BIOEKSEN_SDS_REF: v0.2.0

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit and release note checks read history, not just the tip.
          fetch-depth: 0

      - name: Check out bioeksen-sds at the pinned release
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BIOEKSEN_SDS_REPO }}
          ref: ${{ env.BIOEKSEN_SDS_REF }}
          path: .bioeksen-sds
          # Needed once that repository is private: a token that can read it.
          # token: ${{ secrets.BIOEKSEN_SDS_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the conformance check's dependencies
        run: pip install -r .bioeksen-sds/project-kit/requirements.txt

      - name: Check this pull request's commits
        if: github.event_name == 'pull_request'
        run: >-
          python .bioeksen-sds/project-kit/tools/commit_msg.py
          --range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

      - name: Check the release note
        if: startsWith(github.ref, 'refs/tags/v')
        run: python .bioeksen-sds/project-kit/tools/check_release_note.py "${GITHUB_REF_NAME#v}"

      # Start this service here, however the project runs it — a container,
      # a compose file, a background process — and then check its standard
      # endpoints:
      #
      # - name: Check the standard endpoints
      #   run: >-
      #     python .bioeksen-sds/project-kit/conformance/check_service.py
      #     --base-url http://localhost:8080
